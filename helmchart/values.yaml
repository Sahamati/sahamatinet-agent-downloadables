replicaCount: 1

namespace: sahamatinet-agent

image:
  repository: sahamatidevsecops/sna
  pullPolicy: IfNotPresent
  tag: "v1.2.1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 4044
  targetPort: 4044

resources:
  limits:
    cpu: "5"
    memory: 6Gi
  requests:
    cpu: 200m
    memory: 4Gi

readinessProbe:
  httpGet:
    path: /sna/v1/ping
    port: 4044
  initialDelaySeconds: 10
  periodSeconds: 60
  failureThreshold: 3
  timeoutSeconds: 5
  successThreshold: 1

terminationGracePeriodSeconds: 60
preStopSleepSeconds: 30

# Security Context (required for non-root user)
# Application runs as non-root user (UID 1000) as defined in Dockerfile
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000

data:
  port: "4044"
  routes_prefix: "sna"
  api_response_version: "1.0.0"
  max_payload_size_in_kb: 4096
  gomaxprocs: 0
  error_code: ""
  read_buffer_size: 4096
  env: "production"
  log_level: "INFO"
  processConfig:
    log_transactions: true
    developer_config:
      capture_txn: false
  store:
    db:
      datastore_path: ""
  sla:
    sla_api_url: "" # e.g. prod=>https://api.sahamati.org.in/sla-inputs/aa/v1/push uat=>https://api.uat.sahamati.org.in/sla-inputs/aa/v1/push
    token_generation_base_url: "" # e.g. prod=>https://api.sahamati.org.in/iam/v1 uat=>https://api.uat.sahamati.org.in/iam/v1"
    aa_webhook_url: "" # e.g. https://webhook.site/f407be06-462d-47ab-ad48-5d8ba8a259ea"
    jws_signing_enabled: false
    jws_private_key_path: "/app/certs/sla_jws_private.pem"  # Path where JWS key is mounted
    log_percentile_values: false
  entityConfig:
    credentials: "/app/secrets/credentials.json"  # Path where credentials file is mounted 
  tls:
    https_enabled: false
    cert_file: ""
    key_file: ""
    secretName: ""  # Name of the Kubernetes secret containing TLS certificates. If empty, TLS will be disabled

# Optional: Mount credentials.json from a Secret (for entityConfig.credentials)
credentialsSecret:
  secretName: "sahamatinet-agent-credentials"   # e.g. sahamatinet-agent-credentials
  secretKey: "credentials.json"  # key in the Secret that holds the file content

# Optional: Mount JWS private key from a Secret (for sla.jws_private_key_path)
jwsPrivateKeySecret:
  secretName: ""   # e.g. sahamatinet-agent-jws-key
  secretKey: "sla_jws_private.pem"  # key in the Secret that holds the PEM content

ingress:
  enabled: false
  namespace: sahamatinet-agent
  ssl_redirect: "true"
  cluster_issuer: letsencrypt-prod
  health_path: "/sna/v1/ping"
  api_name: sahamatinet-agent-api-ingress
  api_host: ""
  api_secret_name: ""

global:
  enable_nginx_kong: false
  enable_app_gateway: false
  kong_ingress_class: kong
  app_gateway_ingress_class: azure/application-gateway

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuTarget: 80
  scaleDownWindow: 300

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
