replicaCount: 1

namespace: sahamatinet-agent

image:
  repository: sahamatidevsecops/sahamatinet-agent
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 4044
  targetPort: 4044

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 256Mi

readinessProbe:
  httpGet:
    path: /sna/v1/ping
    port: 4044
  initialDelaySeconds: 10
  periodSeconds: 60
  failureThreshold: 3
  timeoutSeconds: 5
  successThreshold: 1

livenessProbe: {}

terminationGracePeriodSeconds: 60
preStopSleepSeconds: 30

# Application runs as non-root user (UID 1000)
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000

data:
  port: "4044"
  routes_prefix: "sna"
  api_response_version: "1.0.0"
  max_payload_size_in_kb: 4096
  gomaxprocs: 0
  error_code: ""
  read_buffer_size: 4096
  env: "production"
  store:
    db:
      datastore_path: "/app/datastore"
  tls:
    https_enabled: true
    cert_file: "/etc/tls/tls.crt"
    key_file: "/etc/tls/tls.key"

# Required if tls.https_enabled is true
tls:
  secretName: "sahamatinet-agent-tls"

ingress:
  enabled: false
  namespace: sahamatinet-agent
  ssl_redirect: "true"
  cluster_issuer: letsencrypt-prod
  health_path: "/sna/v1/ping"
  api_name: sahamatinet-agent-api-ingress
  api_host: ""
  api_secret_name: ""

global:
  enable_nginx_kong: false
  enable_app_gateway: false
  kong_ingress_class: kong
  app_gateway_ingress_class: azure/application-gateway

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuTarget: 80
  scaleDownWindow: 300

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
