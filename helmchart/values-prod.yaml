# Production overrides for the SahamatiNet Agent chart.
# Applied on top of values.yaml:
#   helm install sahamatinet-agent . -n sahamatinet-agent -f values-prod.yaml

data:
  log_level: "INFO"

  processConfig:
    log_transactions: true
    developer_config:
      capture_txn: false

  sla:
    sla_api_url: "https://api.sahamati.org.in/metrics/perf/v1/push"
    token_generation_base_url: "https://api.sahamati.org.in/iam/v1"
  billing:
    billing_api_url: "" #"<billing ingest URL>"
    disable_billing_push: true  # the only on/off switch for -BIL; true = not pushed, rows still drained
    log_billing: false
