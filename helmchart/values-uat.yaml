# UAT overrides for the SahamatiNet Agent chart.
# Applied on top of values.yaml:
#   helm install sahamatinet-agent . -n sahamatinet-agent -f values-uat.yaml

data:
  log_level: "DEBUG"

  processConfig:
    log_transactions: true
    developer_config:
      capture_txn: true

  sla:
    sla_api_url: "https://api.uat.sahamati.org.in/metrics/perf/v1/push"
    token_generation_base_url: "https://api.uat.sahamati.org.in/iam/v1"
  billing:
    billing_api_url: "https://data.uat.sahamati.org.in/metrics/billing/v1/push" #"<billing ingest URL>"
  telemetry:
    # telemetry_api_url is the destination for the -TEL (telemetry) payload only, with no fallback
    # to sla_api_url. It is REQUIRED when disable_telemetry_push is false - SNA refuses to start
    # without it. Set to the SLA push URL until a dedicated telemetry ingest URL exists.
    telemetry_api_url: ""
    disable_telemetry_push: true #"<telemetry ingest URL>"
